name: Build

# Builds the 1.06 modernizer (dinput8.dll and its blob) on every push and pull
# request, and publishes a release for a v* tag. upstream/ is Open-BFME-2 at
# the pinned commit; its Open-BFME-1 submodule carries the VC7.1 toolchain the
# reference and modern objects compile with.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply the modern variant
        shell: bash
        run: scripts/prepare.sh
      - name: Install dependencies
        run: python -m pip install -r upstream/reference/open-bfme-1/tools/requirements.txt
      - name: Blob format tests
        run: python -m pytest -q tests
      - name: Build
        shell: bash
        run: scripts/build.sh
      - name: Package
        shell: bash
        run: |
          # modernizer-v0.7.0-bfme2-1.06 for a tag, modernizer-main-bfme2-1.06 otherwise
          name="modernizer-${GITHUB_REF_NAME//\//-}-bfme2-1.06"
          mkdir -p "dist/$name"
          cp build/blob/dinput8.dll build/blob/bfme2-modern-106.blob README.md "dist/$name/"
          (cd "dist/$name" && sha256sum dinput8.dll bfme2-modern-106.blob README.md > SHA256SUMS)
          cp build/blob/blob_report.json dist/
          (cd dist && python -m zipfile -c "$name.zip" "$name")
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modernizer-bfme2-1.06
          path: |
            dist/${{ env.PACKAGE }}.zip
            dist/${{ env.PACKAGE }}/SHA256SUMS
            dist/blob_report.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: modernizer-bfme2-1.06
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="modernizer-$TAG-bfme2-1.06"
          {
            echo "BFME II 1.06 modernizer built from ${GITHUB_SHA} by the Build workflow."
            echo
            echo "Copy dinput8.dll and bfme2-modern-106.blob from the zip into the BFME II 1.06 game folder; README.md inside lists settings and limits."
            echo
            echo '```'
            cat "dist/$name/SHA256SUMS"
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "BFME II modernizer $TAG (1.06)" --notes-file notes.md \
            "dist/$name.zip" dist/blob_report.json
